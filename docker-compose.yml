# Edge-to-Cloud monitoring of simulated vital signs (academic project, not a medical system)
#
#   EDGE : Node-RED (simulator, alerts, dashboard) + Mosquitto
#   CLOUD: Kafka (KRaft, single node) + Kafka UI. Bridge and consumers: see the Cloud part.
#
# Addresses:  inside Docker -> mosquitto:1883, kafka:29092
#             from Windows  -> localhost:1883, localhost:9092

services:

  # ---------------- EDGE ----------------
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    networks: [iot_network]

  nodered:
    build:
      context: ./nodered
      args:
        NODERED_VERSION: ${NODERED_VERSION}
        DASHBOARD_VERSION: ${DASHBOARD_VERSION}
    container_name: iot_nodered
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "${NODERED_PORT}:1880"
    volumes:
      - ./nodered/data:/data          # flows.json lives in the repo
    environment:
      - TZ=Europe/Madrid
    networks: [iot_network]

  # ---------------- CLOUD ----------------
  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    container_name: iot_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      # KRaft mode: this node is broker and controller (Raft quorum of 1)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # any base64 UUID, fixed so the data volume stays valid
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly (kafka-topics --create)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [iot_network]

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION}
    container_name: iot_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hospital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [iot_network]

networks:
  iot_network:
    driver: bridge

volumes:
  mosquitto_data:
  kafka_data:
