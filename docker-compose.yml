services:

  # ── Node-RED: simulador, alertas, dashboard y puente a Kafka ──
  nodered:
    build:
      context: ./nodered
      args:
        NODERED_BASE_IMAGE: ${NODERED_BASE_IMAGE}
    container_name: iot_nodered
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${NODERED_PORT}:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=Europe/Madrid
    networks:
      - iot_network

  # ── Broker MQTT (Edge) ──
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    container_name: iot_mosquitto
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${MQTT_PORT}:1883"
      - "${MQTT_WS_PORT}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_network

  # ── ZooKeeper (lo necesita Kafka 7.6 en este modo) ──
  zookeeper:
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION}
    container_name: iot_zookeeper
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - iot_network

  # ── Kafka (Cloud) ──
  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    container_name: iot_kafka
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # Desde Windows: localhost:9092 · desde otro contenedor: kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_EXTERNAL_PORT},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - iot_network

  # ── Kafka UI (para ver topics, offsets y consumer groups) ──
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: iot_kafka_ui
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      JAVA_OPTS: "-Xmx256m"
      KAFKA_CLUSTERS_0_NAME: hospital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - iot_network

networks:
  iot_network:
    driver: bridge

volumes:
  nodered_data:
  mosquitto_data:
  mosquitto_log:
  zookeeper_data:
  zookeeper_log:
  kafka_data: