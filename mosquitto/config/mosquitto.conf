# Mosquitto 2.x needs an explicit listener; without it only local connections are accepted.
listener 1883
protocol mqtt

# Lab environment only: no authentication. A real hospital network would need
# a password_file / client certificates and TLS (listener 8883).
allow_anonymous true

# Persistence keeps QoS 1 messages queued for persistent sessions
# (clean_session=false) across broker restarts.
persistence true
persistence_location /mosquitto/data/

# Messages kept per disconnected persistent client (default 1000).
# 10000 readings = about 4.5 hours of readings for 6 signals every 10 s.
max_queued_messages 10000

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
