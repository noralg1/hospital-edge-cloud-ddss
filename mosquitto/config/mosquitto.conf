# Configuración del broker MQTT para el laboratorio (GA-506 Lab 3)
# Conexiones anónimas habilitadas: entorno de desarrollo/laboratorio,
# no expuesto a Internet. Si publicas el puerto 1883 fuera de tu red
# local, añade autenticación con un password_file.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
